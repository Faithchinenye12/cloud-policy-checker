services:
  - type: web
    name: cloudconform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic -c backend/alembic.ini upgrade head
    initialDeployHook: python -m backend.app.demo_seed
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: cloudconform-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: cloudconform-cache, type: keyvalue, property: connectionString }
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
  - type: worker
    name: cloudconform-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: cloudconform-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: cloudconform-cache, type: keyvalue, property: connectionString }
      - key: JWT_SECRET_KEY
        fromService: { name: cloudconform-api, type: web, envVarKey: JWT_SECRET_KEY }
  - type: keyvalue
    name: cloudconform-cache
    ipAllowList: []
  - type: web
    name: cloudconform-demo
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_PUBLIC_DEMO
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: cloudconform-db
    databaseName: cloudconform
    user: cloudconform
