name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit safety
      
      - name: Lint with ruff
        run: ruff check --select E9,F63,F7,F82 backend/app
      
      - name: Type check with mypy
        continue-on-error: true
        run: mypy --explicit-package-bases backend/app
      
      - name: Security check with bandit
        run: bandit -q -ll -r backend/app

  backend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      
      - name: Run tests
        run: |
          PYTHONPATH=. pytest -c backend/pytest.ini backend/tests --cov-report=xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install browser for recruiter journey
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test recruiter journey
        working-directory: frontend
        env:
          VITE_PUBLIC_DEMO: "true"
        run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API image
        run: docker build -t cloud-policy-checker:latest .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t cloud-policy-checker-worker:latest .

      - name: Build frontend image
        run: docker build -t cloud-policy-checker-frontend:latest frontend
